[package]
name = "terminal-input-types"
version = "0.1.0"
authors = ["Chatminal Contributors"]
edition = "2021"
description = "config serialization for Chatminal via dynamic json-like data values"
license = "MIT"

[lib]
name = "terminal_input_types"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bitflags.workspace = true
euclid.workspace = true
serde = {workspace=true, features = ["rc", "derive"], optional=true}
dynamic.workspace = true

[features]
default = ["serde", "std"]
std = ["serde/std", "euclid/std"]
