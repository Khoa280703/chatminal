rangeset = { path = "crates/rangeset" }
ratelim = { path = "crates/ratelim" }
raw-window-handle = "0.6"
rayon = "1.10"
rcgen = "0.12"
regex = "1"
resize = "0.5"
rstest = "0.21"
rusqlite = "0.32"
serde = { version = "1.0", default-features = false, features = ["derive"] }
