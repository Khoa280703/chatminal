dns-lookup = "2.0"
downcast-rs = "1.0"
dwrote = "0.11"
embed-resource = "1.7"
emojis = "0.6"
encoding_rs = "0.8"
enum-display-derive = "0.1"
env-bootstrap = { path = "crates/env-bootstrap" }
env_logger = "0.11"
euclid = { version = "0.22", default-features = false }
fancy-regex = { version = "0.14", default-features = false, features = [] }
fastrand = "2.0"
filedescriptor = { path = "crates/filedescriptor", version = "0.8.3" }
filenamegen = "0.2.6"
filesystem = { path = "crates/filesystem" }
finl_unicode = { version = "1.3", git = "https://github.com/wez/finl_unicode.git", branch = "no_std", default-features = false, features = ["categories", "grapheme_clusters"] }
fixed = "1.23"
fixedbitset = { version = "0.4", default-features = false }
flume = "0.11"
fnv = "1.0"
fontconfig = { path = "vendor/terminal-deps/fontconfig" }
frecency = { path = "crates/frecency" }
freetype = { path = "vendor/terminal-deps/freetype" }
futures = "0.3"
