[workspace]
members = [
  "apps/desktop",
  "crates/runtime",
  "crates/base91",
  "crates/battery",
  "crates/bintree",
  "crates/config",
  "crates/codec",
  "crates/color-funcs",
  "crates/env-bootstrap",
  "crates/filedescriptor",
  "crates/filesystem",
  "crates/frecency",
  "crates/lfucache",
  "crates/luahelper",
  "crates/logging",
  "crates/lua-bridge",
  "crates/promise",
  "crates/plugin",
  "crates/portable-pty",
  "crates/procinfo",
  "crates/procinfo-funcs",
  "crates/rangeset",
  "crates/ratelim",
  "crates/serde-funcs",
  "crates/share-data",
  "crates/spawn-funcs",
  "crates/tabout",
  "crates/termwiz",
  "crates/termwiz-funcs",
  "crates/time-funcs",
  "crates/umask",
  "crates/url-funcs",
  "crates/vtparse",
  "crates/config-derive",
  "crates/terminal-bidi",
  "crates/terminal-blob-leases",
  "crates/terminal-cell",
  "crates/terminal-char-props",
  "crates/terminal-color-types",
  "crates/dynamic",
  "crates/dynamic-derive",
  "crates/terminal-escape-parser",
  "crates/terminal-font",
  "crates/gui-subcommands",
  "crates/terminal-input-types",
  "crates/open-url",
  "crates/terminal-surface",
  "crates/terminal-emulator",
  "crates/toast-notification",
  "crates/uds",
  "crates/store",
  "crates/window",
  "crates/window-funcs",
  "vendor/terminal-deps/cairo",
  "vendor/terminal-deps/fontconfig",
  "vendor/terminal-deps/freetype",
  "vendor/terminal-deps/harfbuzz",
]
default-members = [
  "apps/desktop",
  "crates/runtime",
  "crates/store",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.93"
version = "0.1.1"

[workspace.dependencies]
ahash = "0.8"
anyhow = "1.0"
assert_fs = "1.0.4"
async-channel = "2.3"
async-executor = "1.11"
async-io = "2.3"
async-task = "4.7"
async-trait = "0.1"
backtrace = "0.3"
base64 = { version = "0.22", default-features = false }
base91 = { path = "crates/base91" }
battery = { path = "crates/battery" }
benchmarking = "0.4"
bintree = { path = "crates/bintree" }
bitflags = "1.3"
block2 = "0.6"
bstr = "1.0"
bytemuck = { version = "1.4", features = ["derive"] }
bytes = "1.0"
cairo-rs = { version = "0.18", default-features = false }
camino = "1.0"
cassowary = "0.3"
cc = { version = "1.0", features = ["parallel"] }
cgl = "0.3"
chrono = { version = "0.4", default-features = false, features = ["unstable-locales", "serde"] }
clap = { version = "4.0", features = ["derive"] }
clap_complete = "4.4"
clap_complete_fig = "4.0"
clipboard-win = "2.2"
cocoa = "=0.25.0"
codec = { path = "crates/codec" }
color-funcs = { path = "crates/color-funcs" }
colorgrad = "0.6"
config = { path = "crates/config" }
core-foundation = "=0.10.0"
