lfucache = { path = "crates/lfucache" }
libc = "0.2"
libflate = "2"
libloading = "0.8"
line_drawing = "0.8"
log = "0.4"
logging = { path = "crates/logging" }
lru = "0.16"
luahelper = { path = "crates/luahelper" }
maplit = "1.0"
memmap2 = "0.9"
