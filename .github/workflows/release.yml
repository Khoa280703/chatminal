name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

env:
  CHATMINAL_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

jobs:
  # ── macOS ──────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Build and package .dmg
        run: bash scripts/release/build-macos.sh
        env:
          CHATMINAL_VERSION: ${{ env.CHATMINAL_VERSION }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg

  # ── Linux ──────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Build and package .tar.gz
        run: bash scripts/release/build-linux.sh
        env:
          CHATMINAL_VERSION: ${{ env.CHATMINAL_VERSION }}
          CI: "true"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-tar
          path: dist/*.tar.gz

  # ── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-

      # Run bootstrap via Git Bash so vendor deps are populated before cargo build.
      # This also lets us pre-generate zconf.h (needed by vendored freetype/zlib on MSVC)
      # because the raw zlib git clone does not include a pre-generated zconf.h.
      - name: Bootstrap vendor deps and generate zconf.h
        shell: bash
        run: |
          bash scripts/bootstrap-terminal-vendor-deps.sh
          ZLIB_DIR="vendor/terminal-deps/freetype/zlib"
          if [[ -f "$ZLIB_DIR/CMakeLists.txt" && ! -f "$ZLIB_DIR/zconf.h" ]]; then
            cmake -S "$ZLIB_DIR" -B "$ZLIB_DIR/_cmake_gen" -G "NMake Makefiles" \
              -DCMAKE_BUILD_TYPE=Release > /dev/null 2>&1 || true
            if [[ -f "$ZLIB_DIR/_cmake_gen/zconf.h" ]]; then
              cp "$ZLIB_DIR/_cmake_gen/zconf.h" "$ZLIB_DIR/zconf.h"
            fi
            rm -rf "$ZLIB_DIR/_cmake_gen"
          fi

      - name: Build and package .zip
        shell: pwsh
        run: scripts/release/build-windows.ps1
        env:
          CHATMINAL_VERSION: ${{ env.CHATMINAL_VERSION }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/*.zip

  # ── GitHub Release ─────────────────────────────────────────────────────────
  publish:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.CHATMINAL_VERSION }}
          name: Chatminal ${{ env.CHATMINAL_VERSION }}
          draft: false
          prerelease: ${{ contains(env.CHATMINAL_VERSION, '-') }}
          generate_release_notes: true
          files: dist/*
